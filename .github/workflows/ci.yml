name: Build Android APK

# Builds a release APK on every push, pull request and manual run.
# The APK is attached to the run as the `buildstock-apk` artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match the Flutter version the project was created and tested with
  # (see .metadata). Pinning removes "works on my machine" differences caused
  # by the moving `stable` channel.
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; Gradle will download SDK components itself."
            exit 0
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" \
            || echo "::warning::sdkmanager install failed; Gradle will try to auto-download."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Provide a stub google-services.json so Firebase initialises at build
      # time. The app falls back to no-auth mode when real credentials are
      # absent, so a placeholder is safe for CI artifact builds.
      - name: Inject google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          DEST="android/app/google-services.json"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > "$DEST"
            echo "Injected google-services.json from secret."
          else
            # Minimal stub that satisfies the Firebase Gradle plugin parser.
            FIREBASE_APP_ID="${{ vars.FIREBASE_ANDROID_APP_ID }}"
            FIREBASE_APP_ID="${FIREBASE_APP_ID:-1:000000000000:android:0000000000000000000000}"
            cat > "$DEST" <<EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "buildstock-ci-stub",
              "storage_bucket": "buildstock-ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "${FIREBASE_APP_ID}",
                  "android_client_info": {
                    "package_name": "com.vijaybalaji.buildstock"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "stub-api-key-for-ci"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "::warning::Using stub google-services.json. Add GOOGLE_SERVICES_JSON secret for real Firebase."
          fi

      # The Drift code (lib/core/database/app_database.g.dart) and the
      # localization code (lib/l10n/generated) are committed, so the build does
      # not depend on build_runner. Regenerate locally with:
      #   dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: >
          flutter build apk --release --no-tree-shake-icons
          --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }}

      - name: Name the APK
        id: apk
        shell: bash
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d+ -f1)"
          NAME="BuildStock-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=build/app/outputs/flutter-apk/${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buildstock-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  # Quality checks run in their own job so that an analyzer note or a flaky
  # test can never prevent the APK from being produced.
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        continue-on-error: true
        run: flutter test --reporter expanded
